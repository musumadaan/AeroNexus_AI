name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt pandas joblib
      - run: python scripts/generate_data.py --train 600
      - name: Fetch public datasets (SHA-256 verified)
        run: python scripts/fetch_public_data.py --only cmapss,ntsb
      - uses: actions/cache@v4
        with: { path: backend/models, key: "models-${{ hashFiles('backend/aeronexus/pdm/**', 'backend/aeronexus/safety/**', 'backend/aeronexus/public_data.py') }}" }
      - name: Train models on public data (skipped when cached)
        run: test -f models/pdm_FD004.joblib || python scripts/train_public_models.py
      - name: Unit, integration, safety, security and scale tests
        run: AERONEXUS_STATE_DB=:memory: pytest -q
      - name: Evaluation regression gate (blocks merge on any regression)
        run: AERONEXUS_STATE_DB=:memory: python -m aeronexus.evals.runner
      - uses: actions/upload-artifact@v4
        with: { name: eval-report, path: backend/data/reports/ }
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
